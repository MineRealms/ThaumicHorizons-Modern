plugins {
    id 'dev.kikugie.stonecutter'
}

// The canonical source in `src/` is written in the 1.20.1 dialect (plan doc section 6).
stonecutter.active('1.20.1-forge')

// A failed node never publishes a partial set of artifacts to the collection directory.
// Keep the MC version in artifact names; the mod id remains isorropia.
tasks.register('buildAndCollect', Sync) {
    group = 'build'
    description = 'Builds, tests and verifies every target, then collects the release jars.'
    dependsOn ':1.20.1-forge:build', ':1.21.1-neoforge:build'
    dependsOn ':1.20.1-forge:nameReleaseJar', ':1.21.1-neoforge:nameReleaseJar'
    from(layout.projectDirectory.dir('versions/1.20.1-forge/build/libs')) { include '*.jar' }
    from(layout.projectDirectory.dir('versions/1.21.1-neoforge/build/libs')) { include '*.jar' }
    into layout.buildDirectory.dir('distributions')
    duplicatesStrategy = DuplicatesStrategy.FAIL
}

// Stonecutter's default processed extensions do not include plain `json`/`mcmeta`, so resource
// replacements would silently do nothing. Reusing the json5 comment configuration registers them
// (plan doc section 5, layer 1; verified in spike S-1c).
stonecutter.handlers {
    inherit('json5', 'json')
    inherit('json5', 'mcmeta')
}

// The version test has to be computed INSIDE the `parameters {}` block: the controller replays it
// once per version project, so `current` there is the node being configured. A value computed at
// the script's top level runs once on the ROOT with the active version and silently pins every
// rule to one direction; and inside `constants {}`/`replacements {}` a bare `current` is shadowed
// by MapProperty.get(String). Both traps are documented in the plan doc (sections 5 and 10, S-1c).
stonecutter.parameters {
    def neo = current.project.endsWith('-neoforge')

    constants {
        put('forge', !neo)
        put('neoforge', neo)
    }

    replacements {
        // Only the NeoForge target transforms symbols. The Forge target must not reverse
        // replacements inside inactive NeoForge branches of the canonical source, so the whole
        // section is behind this guard (plan doc section 10).
        if (!neo) {
            return
        }
        // Order matters: the generic `net.minecraftforge.` rule at the bottom must not see a path a
        // more specific rule already rewrote, or `net.minecraftforge.api.distmarker` would become
        // `net.neoforged.neoforge.api.distmarker`.
        string(neo) {
            replace('net.minecraftforge.eventbus.api.', 'net.neoforged.bus.api.')
        }
        string(neo) {
            replace('net.minecraftforge.api.distmarker.', 'net.neoforged.api.distmarker.')
        }
        string(neo) {
            replace('net.minecraftforge.fml.', 'net.neoforged.fml.')
        }

        // Class renames where the simple name changed too, so they must precede the generic rule.
        string(neo) {
            replace('net.minecraftforge.common.MinecraftForge', 'net.neoforged.neoforge.common.NeoForge')
        }
        string(neo) {
            replace('net.minecraftforge.common.ForgeConfigSpec', 'net.neoforged.neoforge.common.ModConfigSpec')
        }
        string(neo) {
            // Isorropia's MenusIS registers its menus through this factory.
            replace('net.minecraftforge.common.extensions.IForgeMenuType',
                    'net.neoforged.neoforge.common.extensions.IMenuTypeExtension')
        }
        string(neo) {
            // Isorropia's shearable animals implement the Forge interface; NeoForge renamed it.
            replace('net.minecraftforge.common.IForgeShearable', 'net.neoforged.neoforge.common.IShearable')
        }
        string(neo) {
            replace('net.minecraftforge.registries.ForgeRegistries',
                    'net.neoforged.neoforge.registries.NeoForgeRegistries')
        }
        string(neo) {
            replace('net.minecraftforge.event.entity.living.LivingHurtEvent',
                    'net.neoforged.neoforge.event.entity.living.LivingIncomingDamageEvent')
        }
        string(neo) {
            replace('net.minecraftforge.client.event.RegisterGuiOverlaysEvent',
                    'net.neoforged.neoforge.client.event.RegisterGuiLayersEvent')
        }

        // NeoForge 1.21.1 moved the capability API out of `common.capabilities` into a top-level
        // `capabilities` package, and renamed `ForgeCapabilities` to `Capabilities`. The class
        // rename has to precede the package move (both are expressed in 1.20.1 source terms).
        // `Capability` itself has no successor - it was split into `BlockCapability` /
        // `ItemCapability` / `EntityCapability` - so that one stays a structural error.
        string(neo) {
            replace('net.minecraftforge.common.capabilities.ForgeCapabilities',
                    'net.neoforged.neoforge.capabilities.Capabilities')
        }
        string(neo) {
            replace('net.minecraftforge.common.capabilities.', 'net.neoforged.neoforge.capabilities.')
        }

        // Catch-all for the remaining pure package moves.
        string(neo) {
            replace('net.minecraftforge.', 'net.neoforged.neoforge.')
        }

        // Isorropia annotates five client/game-bus subscribers; NeoForge renamed the game bus.
        // This rule must precede the EventBusSubscriber rename below.
        string(true) {
            replace('Mod.EventBusSubscriber.Bus.FORGE', 'net.neoforged.fml.common.EventBusSubscriber.Bus.GAME')
        }
        string(true) {
            replace('Mod.EventBusSubscriber', 'net.neoforged.fml.common.EventBusSubscriber')
        }
        // Imports and unqualified references must agree. Restrict renames to identifier boundaries.
        // (regex replacements require the reverse pair even when the rule is neo-only.)
        // RegistryObject is absent from this table: both loaders' register() calls return a
        // Supplier, so the registry classes declare `Supplier<T>` fields and compile raw on both.
        [MinecraftForge: 'NeoForge', ForgeConfigSpec: 'ModConfigSpec',
         IForgeMenuType: 'IMenuTypeExtension', IForgeShearable: 'IShearable',
         ForgeRegistries: 'NeoForgeRegistries',
         ForgeEventFactory: 'EventHooks',
         IEntityAdditionalSpawnData: 'IEntityWithComplexSpawn',
         LivingHurtEvent: 'LivingIncomingDamageEvent',
         RegisterGuiOverlaysEvent: 'RegisterGuiLayersEvent'].each { before, after ->
            regex(true) {
                replace('\\b' + before + '\\b', after, '\\b' + after + '\\b', before)
            }
        }

        // ---------------------------------------------------------------- vanilla drift
        // 1.21 collapsed the ForgeRegistries vanity map: vanilla-owned registries live in
        // BuiltInRegistries, several with singular names. These must run before the generic
        // ForgeRegistries rename below.
        [['ITEMS', 'ITEM'], ['BLOCKS', 'BLOCK'], ['BLOCK_ENTITY_TYPES', 'BLOCK_ENTITY_TYPE'],
         ['SOUND_EVENTS', 'SOUND_EVENT'], ['MENU_TYPES', 'MENU'], ['RECIPE_SERIALIZERS', 'RECIPE_SERIALIZER'],
         ['ATTRIBUTES', 'ATTRIBUTE'], ['ENTITY_TYPES', 'ENTITY_TYPE'], ['MOB_EFFECTS', 'MOB_EFFECT']].each { before, after ->
            regex(neo) {
                replace('ForgeRegistries\\.' + before + '\\b', 'BuiltInRegistries.' + after,
                        'BuiltInRegistries\\.' + after + '\\b', 'ForgeRegistries.' + before)
            }
        }
        // 1.20.5 moved the dispenser context into its own package.
        string(neo) {
            replace('import net.minecraft.core.BlockSource;', 'import net.minecraft.core.dispenser.BlockSource;')
        }
        // 1.20.5 turned BlockSource into a record. Every Isorropia dispense behaviour names it `source`.
        [['getLevel', 'level'], ['getPos', 'pos'], ['getBlockState', 'state']].each { before, after ->
            regex(neo) {
                replace('\\bsource\\.' + before + '\\(\\)', 'source.' + after + '()',
                        '\\bsource\\.' + after + '\\(\\)', 'source.' + before + '()')
            }
        }
        // FoodProperties.Builder renamed its saturation setter; ChunkStatus moved into its own package; the
        // killer loot parameter took the name of the vanilla constant it aliases; NeoForge renamed the
        // mob-griefing query.
        string(neo) {
            replace('.saturationMod(', '.saturationModifier(')
        }
        string(neo) {
            replace('import net.minecraft.world.level.chunk.ChunkStatus;',
                    'import net.minecraft.world.level.chunk.status.ChunkStatus;')
        }
        string(neo) {
            replace('LootContextParams.KILLER_ENTITY', 'LootContextParams.ATTACKING_ENTITY')
        }
        string(neo) {
            replace('getMobGriefingEvent(', 'canEntityGrief(')
        }
        string(neo) {
            replace('.alwaysEat()', '.alwaysEdible()')
        }
        // 1.21 renamed the set-fire hook and `Blocks.GRASS` became the explicit short grass.
        string(neo) {
            replace('setSecondsOnFire', 'igniteForSeconds')
        }
        regex(neo) {
            replace('\\bBlocks\\.GRASS\\b', 'Blocks.SHORT_GRASS',
                    '\\bBlocks\\.SHORT_GRASS\\b', 'Blocks.GRASS')
        }
        // 1.21.1 dropped FollowOwnerGoal's teleport flag (the behaviour is unconditional).
        regex(neo) {
            replace('new FollowOwnerGoal\\(this, 1\\.0D, 10\\.0F, 5\\.0F, false\\)',
                    'new FollowOwnerGoal(this, 1.0D, 10.0F, 5.0F)',
                    'new FollowOwnerGoal\\(this, 1\\.0D, 10\\.0F, 5\\.0F\\)',
                    'new FollowOwnerGoal(this, 1.0D, 10.0F, 5.0F, false)')
        }
        // 1.21.1 TemptGoal takes an ItemStack predicate instead of an Ingredient.
        regex(neo) {
            replace('Ingredient\\.of\\(Items\\.WHEAT\\)', 'stack -> stack.is(Items.WHEAT)',
                    'stack -> stack\\.is\\(Items\\.WHEAT\\)', 'Ingredient.of(Items.WHEAT)')
        }
        regex(neo) {
            replace('new TaintFoodIngredient\\(\\)', 'new TaintFoodIngredient()::test',
                    'new TaintFoodIngredient\\(\\)::test', 'new TaintFoodIngredient()')
        }
        // `new ResourceLocation(ns, path)` was replaced by a named factory in 1.20.5. The second
        // pair is the reverse rule: a `regex` replacement needs both directions spelled out.
        regex(neo) {
            replace(
                    'new ResourceLocation\\(', 'ResourceLocation.fromNamespaceAndPath(',
                    'ResourceLocation\\.fromNamespaceAndPath\\(', 'new ResourceLocation('
            )
        }

        // 1.20.5 renamed the ItemStack equality helper to match the component model.
        string(neo) {
            replace('isSameItemSameTags', 'isSameItemSameComponents')
        }
        // NeoForge renamed the entity add-level flag and moved render culling to vanilla.
        string(neo) {
            replace('isAddedToWorld', 'isAddedToLevel')
        }
        string(neo) {
            replace('getRenderBoundingBox', 'getBoundingBoxForCulling')
        }
        // NeoForge moved the spawn egg into `common` with the same constructor shape.
        string(neo) {
            replace('net.minecraftforge.common.ForgeSpawnEggItem',
                    'net.neoforged.neoforge.common.DeferredSpawnEggItem')
        }
        regex(neo) {
            replace('\\bForgeSpawnEggItem\\b', 'DeferredSpawnEggItem',
                    '\\bDeferredSpawnEggItem\\b', 'ForgeSpawnEggItem')
        }

        // ---------------------------------------------------------------- TC4R drift
        // TC4R 20736 dropped `NativeRenderTypes`; its `create` was a pass-through to the vanilla
        // factory, which is public static with the same signature in 1.21.1.
        string(neo) {
            replace('import dev.tc4port.thaumcraft.nativeimpl.NativeRenderTypes;',
                    '// TC4R 20736 removed NativeRenderTypes; the vanilla factory replaces it.')
        }
        string(neo) {
            replace('NativeRenderTypes.create(', 'RenderType.create(')
        }

        // 1.21 removed MobType in favour of entity-type tags; every Isorropia use is the
        // UNDEAD comparison, so both the import and the comparison rewrite to the tag.
        string(neo) {
            replace('import net.minecraft.world.entity.MobType;', 'import net.minecraft.tags.EntityTypeTags;')
        }
        regex(neo) {
            replace('(\\w+)\\.getMobType\\(\\) == MobType\\.UNDEAD', '$1.getType().is(EntityTypeTags.UNDEAD)',
                    '(\\w+)\\.getType\\(\\)\\.is\\(EntityTypeTags\\.UNDEAD\\)', '$1.getMobType() == MobType.UNDEAD')
        }
    }
}
