org.gradle.jvmargs=-Xmx4G -Dfile.encoding=UTF-8
org.gradle.daemon=false
# Stonecutter's Groovy support is intentional here; silence its "limited support" notice.
dev.kikugie.stonecutter.hard_mode=true
# The HTTP(S) proxy is machine-specific and lives in ~/.gradle/gradle.properties, not here.

mod_id=isorropia
# Gradle reads this file as ISO-8859-1, so any Chinese text is written as escapes; a literal one here
# reaches the jar double-encoded and shows as mojibake in the mod list.
mod_name=Thaumic Horizons
# The build's own artifact stays ASCII: Forge's reobf hands its jar path to a separate renamer process,
# which mangles non-ASCII paths on Windows. The release copy carries the Chinese name (see build.gradle).
mod_archive_name=ThaumicHorizons
mod_file_name=\u795e\u79d8\u89c6\u754c ThaumicHorizons
mod_license=All Rights Reserved
mod_version=1.0.2-alpha
mod_group_id=fr.wind_blade.isorropia
mod_authors=wind_blade, keletu, IcarussOne; unofficial port contributors
mod_description=Thaumic Horizons (Isorropia) for Thaumcraft 4 Reborn on Minecraft 1.20.1 Forge and 1.21.1 NeoForge. / \u795e\u79d8\u89c6\u754c\uff1a\u4e3a\u795e\u79d8\u65f6\u4ee34\u91cd\u751f\u7248\u5e26\u6765\u751f\u7269\u6ce8\u9b54\u3001\u6e90\u8d28\u673a\u68b0\u4e0e\u53e3\u888b\u4f4d\u9762\u3002

junit_version=5.10.2
