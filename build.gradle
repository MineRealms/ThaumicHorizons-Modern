// Stonecutter's shared build script: it runs once per node (plan doc section 6).
// S0 carries only the 1.20.1/Forge branch; S1 adds the 1.21.1/NeoForge branch beside it.
plugins {
    id 'eclipse'
    id 'idea'
    id 'dev.kikugie.stonecutter'
    // Both loader plugin families come from ModDevGradle. They are declared here (apply false)
    // so that the per-node branch below can apply exactly one of them.
    id 'net.neoforged.moddev.legacyforge' version '2.0.148' apply false
    id 'net.neoforged.moddev' version '2.0.148' apply false
}

def isForge = mod_loader == 'forge'

version = mod_version
group = mod_group_id
// Display/artifact branding is independent of the stable mod id used by saves and dependencies.
base { archivesName = "${mod_archive_name}-${minecraft_version}" }
java.toolchain.languageVersion = JavaLanguageVersion.of(java_version.toInteger())

def tc4Repository = file(providers.gradleProperty('tc4Repository')
        .getOrElse(rootProject.file('local-repo').absolutePath))

// Generated resources are per-node: a shared directory would let the two `runData` outputs
// overwrite each other (plan risk R8).
sourceSets.main.resources {
    srcDir rootProject.file(isForge ? 'src/generated/resources' : 'src/generated/resources-1.21.1')
}

if (isForge) {
    // ---------------------------------------------------------------- 1.20.1 / Forge (LegacyForge)
    apply plugin: 'net.neoforged.moddev.legacyforge'

    legacyForge {
        version = "${minecraft_version}-${forge_version}"

        runs {
            configureEach {
                gameDirectory = rootProject.file('run')
                systemProperty 'forge.logging.console.level', 'info'
                // LegacyForge dev runs need the config explicitly; packaged jars use MixinConfigs.
                programArgument '--mixin'
                programArgument "${mod_id}.mixins.json"
                // LegacyForge sets `mixin.env.remapRefMap` and `mixin.env.refMapRemappingFile`
                // itself (pointing at its own `moddev/artifacts/intermediateToNamed.srg`), so the
                // single-version build's hand-written values must NOT be repeated here - a stale
                // path silently disables refmap remapping and every SRG-named dependency mixin
                // fails to apply.
            }
            client {
                client()
                gameDirectory = rootProject.file('run-client')
                // The Rosetta bridge's findMinecraftDirectory falls back to scanning the classpath
                // for ".minecraft" when neither `minecraft.gameDir` nor `--gameDir` resolves - and
                // under ModDevGradle every `net.minecraftforge\...` cache entry contains that
                // substring (from ".minecraftforge"), so the walk hits the drive root and NPEs
                // (its 1.0.0 jar has no null guard). Point branch 1 at the game dir explicitly;
                // ForgeGradle 6 resolved the same directory via its own `--gameDir` handling.
                systemProperty 'minecraft.gameDir', rootProject.file('run-client').absolutePath
                // Automated client testing needs a loaded world: the RosettaRemoteDebugBridge only
                // starts listening on ServerStartedEvent, which on a client means "a world was
                // joined", not "the title screen appeared". tools/client_probe.py passes this.
                if (project.hasProperty('quickPlay')) {
                    programArgument '--quickPlaySingleplayer'
                    programArgument project.property('quickPlay').toString()
                }
                // Its own bridge port, so a client and a dedicated server can be probed at once
                // without one of them failing to bind. Harmless when the bridge is not installed.
                systemProperty 'rosetta.remote.port', providers.gradleProperty('clientProbePort').getOrElse('48791')
            }
            server {
                server()
                gameDirectory = rootProject.file('run-server')
                programArgument '--nogui'
            }
            gameTestServer {
                type = 'gameTestServer'
                gameDirectory = rootProject.file('run-gametest')
                systemProperty 'forge.enabledGameTestNamespaces', mod_id
            }
            data {
                data()
                gameDirectory = rootProject.file('run-data')
                programArgument '--mod'
                programArgument mod_id
                programArgument '--all'
                programArgument rootProject.file('src/generated/resources/').absolutePath
                programArgument '--existing'
                programArgument rootProject.file('src/main/resources/').absolutePath
            }
        }

        mods {
            isorropia {
                sourceSet sourceSets.main
            }
        }

        // LegacyForge has no `unitTest { }` block (that is NeoForge-only), so the JUnit suite has
        // to be given the modding classpath explicitly. Without this the `test` source set sees
        // only `implementation` and none of Minecraft/Forge - `compileTestJava` then fails on
        // every vanilla import.
        addModdingDependenciesTo sourceSets.test
    }

    repositories {
        maven {
            name = 'LocalTC4R'
            url = uri(tc4Repository)
            content { includeGroup 'dev.tc4port'; includeGroup 'tc4addons' }
        }
        maven { url = 'https://maven.theillusivec4.top' }
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
    }

    dependencies {
        // ModDevGradle's mod* configurations remap SRG -> official and are non-transitive, which
        // is exactly the semantics ForgeGradle's `fg.deobf(..., { transitive = false })` had.
        modImplementation("dev.tc4port:thaumcraft-forge:${thaumcraft_version}") { transitive = false }
        // Optional local TC4R addon set, for exercising the dev client against real addons
        // (-PwithTc4Addons). They MUST come through a mod* configuration: ModDevGradle remaps
        // classpath mods SRG->named, while jars dropped straight into run-client/mods are loaded
        // untouched and fail at CONSTRUCT with NoSuchFieldError/NoSuchMethodError on SRG names.
        if (project.hasProperty('withTc4Addons')) {
            ['forbidden_magic:0.574-1.20.1-port.0.1.0-20739',
             'thaumictinkerer:2.5-1.20.1-port.0.1.0-20739',
             'tainted_magic:8.1.1-1.20.1-port.0.1.0-20739',
             'warptheory:1.5.8-GTNH-1.20.1-port.0.1.0-20739',
             'nodalmechanics:1.0.7-port.0.1.0-20739',
             'tc4tweaks:1.1.5',
             // Botania is a hard dependency of technom; Patchouli and Curios are Botania's own
             // mandatory deps (Curios is already on the classpath above).
             'botania:1.20.1-454-FORGE',
             'patchouli:1.20.1-85-FORGE',
             // .3 registers the Botania machines unconditionally (hard dependency), so their
             // loot tables always name a registered item.
             'technom:0.1.0-dev.3'].each { coord ->
                modRuntimeOnly("tc4addons:${coord}") { transitive = false }
            }
        }
        // TC4R declares both mandatory, and the Somatic Brain is a Curios head item.
        modImplementation("top.theillusivec4.curios:curios-forge:${curios_version}") { transitive = false }
        modRuntimeOnly("com.github.glitchfiend:TerraBlender-forge:${terrablender_version}") {
            transitive = false
        }

        testImplementation(platform("org.junit:junit-bom:${junit_version}"))
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.named('processResources', ProcessResources).configure {
        def values = [minecraft_version_range: minecraft_version_range,
                forge_version_range: forge_version_range, loader_version_range: loader_version_range,
                mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
                mod_authors: mod_authors, mod_description: mod_description,
                thaumcraft_runtime_version: thaumcraft_runtime_version]
        inputs.properties values
        filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) { expand values }
    }

    tasks.named('jar', Jar).configure {
        // Forge 1.20.1 reads mixin configs only from the MixinConfigs manifest attribute. Dev runs
        // load the exploded resources directory, which carries the same attribute in
        // META-INF/MANIFEST.MF; the jar gets a generated one instead.
        exclude 'META-INF/MANIFEST.MF'
        manifest {
            attributes('Specification-Title': mod_name, 'Specification-Vendor': mod_authors,
                    'Specification-Version': '1',
                    // `project.name` is the Stonecutter node name (e.g. `1.20.1-forge`), so build
                    // the human-facing title from the root project name plus the logical MC
                    // version; this reproduces the single-version build's `Isorropia-1.20.1`.
                    'Implementation-Title': "${rootProject.name}-${sc.current.version}",
                    'Implementation-Version': project.version, 'Implementation-Vendor': mod_authors,
                    'MixinConfigs': "${mod_id}.mixins.json")
        }
        // ModDevGradle performs the SRG reobf itself; a hand-rolled `finalizedBy 'reobfJar'`
        // would double-run (or fail on a missing task).
    }
} else {
    // ---------------------------------------------------------------- 1.21.1 / NeoForge
    apply plugin: 'net.neoforged.moddev'
    apply from: rootProject.file('gradle/neoforge-resources.gradle')

    neoForge {
        version = neo_version

        runs {
            configureEach {
                gameDirectory = rootProject.file('run')
                systemProperty 'forge.logging.console.level', 'info'
            }
            client {
                client()
                gameDirectory = rootProject.file('run-client-1.21.1')
                // Same bridge-resolution fix as the Forge node: without it the bridge 1.0.0 jar
                // falls into its guardless ".minecraft" classpath walk and NPEs at construct.
                systemProperty 'minecraft.gameDir', rootProject.file('run-client-1.21.1').absolutePath
                if (project.hasProperty('quickPlay')) {
                    programArgument '--quickPlaySingleplayer'
                    programArgument project.property('quickPlay').toString()
                }
                // R9: the two nodes must not share a bridge port. 1.20.1 owns 48791.
                systemProperty 'rosetta.remote.port', providers.gradleProperty('clientProbePort').getOrElse('48792')
            }
            server {
                server()
                gameDirectory = rootProject.file('run-server-1.21.1')
                programArgument '--nogui'
            }
            gameTestServer {
                // MDG's RunModel has no `gameTestServer()` helper; the type is set by name.
                type = 'gameTestServer'
                gameDirectory = rootProject.file('run-gametest-1.21.1')
                // NeoForge renamed the Forge `forge.*` system properties to `neoforge.*`.
                systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            }
            data {
                data()
                gameDirectory = rootProject.file('run-data-1.21.1')
                programArgument '--mod'
                programArgument mod_id
                programArgument '--all'
                programArgument rootProject.file('src/generated/resources-1.21.1/').absolutePath
                programArgument '--existing'
                programArgument rootProject.file('src/main/resources/').absolutePath
            }
        }

        mods {
            isorropia {
                sourceSet sourceSets.main
            }
        }

        // Unlike legacyforge, the NeoForge extension does have `unitTest`: it wires the modding
        // classpath and the mod's own test resources into the `test` source set for us.
        unitTest {
            enable()
            testedMod = mods.isorropia
        }
    }

    repositories {
        maven {
            name = 'LocalTC4R'
            url = uri(tc4Repository)
            content { includeGroup 'dev.tc4port'; includeGroup 'tc4addons' }
        }
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.theillusivec4.top' }
        maven {
            url = 'https://api.modrinth.com/maven'
            content { includeGroup 'maven.modrinth' }
        }
        mavenCentral()
    }

    dependencies {
        // Core ModDevGradle has no `mod*` configurations - those are a legacyforge addition. On
        // 1.21.1 that is fine: NeoForge runs in official mappings, so nothing needs remapping and
        // the ordinary configurations carry mods just as well.
        implementation("dev.tc4port:thaumcraft-neoforge:${thaumcraft_version}") { transitive = false }
        // TC4R declares both mandatory, and the Somatic Brain is a Curios head item - unlike
        // Technomancy, Isorropia compiles against the Curios API (SomaticBrainCurioRenderer),
        // so the Curios artifact is on the implementation path here too.
        implementation("top.theillusivec4.curios:curios-neoforge:${curios_version}") { transitive = false }
        // Pin the official Modrinth file, whose Maven version number is otherwise ambiguous across loaders.
        runtimeOnly("maven.modrinth:terrablender:${terrablender_file}") { transitive = false }

        testImplementation(platform("org.junit:junit-bom:${junit_version}"))
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
}

// Optional integrations are compiled against their APIs; enable runtimes for compatibility testing.
repositories {
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://maven.latvian.dev/releases' }
    maven { url = 'https://maven.architectury.dev' }
    // KubeJS NeoForge pulls com.github.rtyley:animated-gif-lib-for-java, which only JitPack hosts.
    maven { url = 'https://jitpack.io' }
}
dependencies {
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${isForge ? '15.56.0.205' : '19.57.0.451'}"
    if (isForge) {
        modCompileOnly 'dev.latvian.mods:kubejs-forge:2001.6.5-build.26'
        if (providers.gradleProperty('compatTest').isPresent()) {
            modRuntimeOnly 'mezz.jei:jei-1.20.1-forge:15.56.0.205'
            modRuntimeOnly 'dev.latvian.mods:kubejs-forge:2001.6.5-build.26'
            modRuntimeOnly 'dev.latvian.mods:rhino-forge:2001.2.3-build.10'
            modRuntimeOnly 'dev.architectury:architectury-forge:9.2.14'
        }
    } else {
        compileOnly 'dev.latvian.mods:kubejs-neoforge:2101.7.2-build.377'
        if (providers.gradleProperty('compatTest').isPresent()) {
            runtimeOnly 'mezz.jei:jei-1.21.1-neoforge:19.57.0.451'
            runtimeOnly 'dev.latvian.mods:kubejs-neoforge:2101.7.2-build.377'
            runtimeOnly 'dev.latvian.mods:rhino:2101.2.7-build.81'
        }
    }
}

// Process test sources using the same target rules as production sources.
stonecutter.tasks.configureSource(sourceSets.test)

// ---------------------------------------------------------------- shared by all nodes
tasks.named('test', Test).configure {
    useJUnitPlatform()
    // The single-version build ran tests with the repo root as working directory (project dir ==
    // root); the node project now lives in versions/<node>, so pin it back.
    workingDir = rootProject.projectDir
    testLogging { events 'failed'; exceptionFormat 'full' }
}

tasks.register('verifyLocalDependencies') {
    group = 'verification'
    description = 'Checks supplied TC4R artifacts against the recorded SHA-256 hashes.'
    doLast {
        // Each node has its own artifact set. `DEPENDENCIES.json` is the 1.20.1 manifest the
        // existing bootstrap references, so it keeps its name; a node-qualified file takes
        // precedence when one exists (S1 adds DEPENDENCIES.1.21.1-neoforge.json).
        def nodeManifest = rootProject.file("local-repo/DEPENDENCIES.${sc.current.project}.json")
        def manifestFile = nodeManifest.isFile() ? nodeManifest
                : rootProject.file('local-repo/DEPENDENCIES.json')
        def manifest = new groovy.json.JsonSlurper().parse(manifestFile)
        manifest.artifacts.each { artifact ->
            def target = new File(tc4Repository, artifact.path)
            if (!target.isFile()) {
                throw new GradleException("Missing ${target}. See local-repo/README.md.")
            }
            def digest = java.security.MessageDigest.getInstance('SHA-256').digest(target.bytes).encodeHex().toString()
            if (digest != artifact.sha256) {
                throw new GradleException("TC4R checksum mismatch: ${target.name}. Keep the version and manifest in sync.")
            }
        }
        logger.lifecycle("Verified ${manifest.artifacts.size()} TC4R artifacts for ${sc.current.project} via ${manifestFile.name}")
    }
}
tasks.named('compileJava').configure { dependsOn 'verifyLocalDependencies' }
tasks.named('check').configure { dependsOn 'verifyLocalDependencies' }

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Surface the whole error list when the S1 node switch lands: the first compile of the
    // 1.21.1 dialect is measured, not iterated one error at a time.
    options.compilerArgs.addAll(['-Xmaxerrs', '2000'])
}

// The distributed file carries the Chinese name the project calls itself; the artifact above stays ASCII
// because Forge's reobf hands its jar path to a separate renamer process, which mangles non-ASCII paths on
// Windows. `build` therefore leaves both: the ASCII artifact and its Chinese-named copy beside it.
tasks.named('build').configure { finalizedBy 'nameReleaseJar' }
tasks.register('nameReleaseJar', Copy) {
    from(layout.buildDirectory.dir('libs')) {
        include "${base.archivesName.get()}-${project.version}.jar"
    }
    into layout.buildDirectory.dir('libs')
    rename { "${mod_file_name}-${minecraft_version}-${project.version}.jar" }
}
